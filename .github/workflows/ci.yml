name: Godot CI

on:
  push:
    branches: ["main", "rr-001/**", "rr-003/**", "rr-004/**", "feat/rr-004/**", "feat/rr-005/**", "feat/rr-007/**", "feat/rr-007-*", "feat/rr-008/**", "feat/rr-008-*", "feat/rr-007-008*", "docs/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  foundation-smoke:
    name: Foundation smoke test
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify engine version
        run: godot --version
      - name: Import project and register global script classes
        run: godot --headless --editor --path . --quit
      - name: Run headless smoke test
        run: godot --headless --path . --script res://tests/smoke_test.gd
      - name: Run movement test suite
        run: godot --headless --path . --script res://tests/movement_test.gd
      - name: Run animation profile test suite
        run: godot --headless --path . --script res://tests/animation_profile_test.gd
      - name: Run animation tree graph test suite
        run: godot --headless --path . --script res://tests/animation_tree_graph_test.gd
      - name: Run character animation controller test suite
        run: godot --headless --path . --script res://tests/character_animation_controller_test.gd
      - name: Run character animation integration test suite
        run: godot --headless --path . --script res://tests/character_animation_integration_test.gd
      - name: Run hero animation profile test suite
        run: godot --headless --path . --script res://tests/hero_animation_profile_test.gd
      - name: Run animation asset-contract validation suite
        run: godot --headless --path . --script res://tests/animation_rig_validation_test.gd
      - name: Run RR-005 health component test suite
        run: godot --headless --path . --script res://tests/health_component_test.gd
      - name: Run RR-005 attack executor test suite
        run: godot --headless --path . --script res://tests/attack_executor_test.gd
      - name: Run RR-005 collision hit detection test suite
        run: godot --headless --path . --script res://tests/combat_hit_detection_test.gd
      - name: Run RR-005 hero combat controller test suite
        run: godot --headless --path . --script res://tests/hero_combat_controller_test.gd
      - name: Run RR-005 enemy and boss combat test suite
        run: godot --headless --path . --script res://tests/enemy_boss_combat_test.gd
      - name: Run RR-005 hit reaction and death presentation test suite
        run: godot --headless --path . --script res://tests/combat_reaction_test.gd
      - name: Run RR-005 deterministic encounter validation suite
        run: godot --headless --path . --script res://tests/combat_encounter_validation_test.gd
      - name: Run RR-007 procedural world generator test suite
        run: godot --headless --path . --script res://tests/procedural_world_generator_test.gd
      - name: Run RR-007 encounter spawn director test suite
        run: godot --headless --path . --script res://tests/encounter_spawn_director_test.gd
      - name: Run RR-007 runtime streaming and pooling test suite
        run: godot --headless --path . --script res://tests/world_streaming_pool_test.gd
      - name: Run RR-007 runtime encounter spawner test suite
        run: godot --headless --path . --script res://tests/encounter_runtime_spawner_test.gd
      - name: Run RR-008 enemy AI controller test suite
        run: godot --headless --path . --script res://tests/enemy_ai_controller_test.gd
      - name: Run RR-008 enemy perception test suite
        run: godot --headless --path . --script res://tests/enemy_perception_test.gd
      - name: Run RR-008 chase steering test suite
        run: godot --headless --path . --script res://tests/enemy_chase_controller_test.gd
      - name: Run RR-008 archetype policy test suite
        run: godot --headless --path . --script res://tests/enemy_archetype_controller_test.gd
      - name: Run RR-008 squad coordination test suite
        run: godot --headless --path . --script res://tests/enemy_squad_coordinator_test.gd
      - name: Run RR-008 D5.2 retreat and squad compatibility test suite
        run: godot --headless --path . --script res://tests/enemy_squad_coordination_d52_test.gd
      - name: Run RR-008 D6 tactical encounter test suite
        run: godot --headless --path . --script res://tests/encounter_tactical_coordination_d6_test.gd
